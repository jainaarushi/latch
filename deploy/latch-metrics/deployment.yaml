apiVersion: apps/v1
kind: Deployment
metadata:
  name: latch-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: latch-metrics
  template:
    metadata:
      labels:
        app: latch-metrics
    spec:
      containers:
        - name: latch-metrics
          image: python:3.12-slim
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              pip install --no-cache-dir -r /app/requirements.txt
              exec uvicorn main:app --host 0.0.0.0 --port 8080 --app-dir /app
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus.observability.svc.cluster.local:9090
            - name: TARGET_NAMESPACE
              value: kubnamespace
            - name: REQUEST_TIMEOUT_S
              value: "10"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: latch-metrics-code
---
apiVersion: v1
kind: Service
metadata:
  name: latch-metrics
spec:
  selector:
    app: latch-metrics
  ports:
    - name: http
      port: 8080
      targetPort: 8080
