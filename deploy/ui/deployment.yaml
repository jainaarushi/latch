apiVersion: apps/v1
kind: Deployment
metadata:
  name: latch-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: latch-ui
  template:
    metadata:
      labels:
        app: latch-ui
    spec:
      containers:
        - name: latch-ui
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8088
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: ui
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: ui
          configMap:
            name: latch-ui-assets
        - name: nginx-conf
          configMap:
            name: latch-ui-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: latch-ui
spec:
  selector:
    app: latch-ui
  ports:
    - name: http
      port: 8088
      targetPort: 8088
