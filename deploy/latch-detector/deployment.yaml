apiVersion: apps/v1
kind: Deployment
metadata:
  name: latch-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: latch-detector
  template:
    metadata:
      labels:
        app: latch-detector
    spec:
      containers:
        - name: latch-detector
          image: python:3.12-slim
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              pip install --no-cache-dir -r /app/requirements.txt
              exec uvicorn main:app --host 0.0.0.0 --port 8081 --app-dir /app
          env:
            - name: METRICS_STATE_URL
              value: http://latch-metrics:8080/state
            - name: RULES_PATH
              value: /app/rules.yaml
            - name: REQUEST_TIMEOUT_S
              value: "10"
            - name: POLL_INTERVAL_S
              value: "5"
          ports:
            - containerPort: 8081
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: latch-detector-code
---
apiVersion: v1
kind: Service
metadata:
  name: latch-detector
spec:
  selector:
    app: latch-detector
  ports:
    - name: http
      port: 8081
      targetPort: 8081
