apiVersion: v1
kind: ServiceAccount
metadata:
  name: latch-api-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: latch-api-gateway
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: latch-api-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: latch-api-gateway
subjects:
  - kind: ServiceAccount
    name: latch-api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: latch-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: latch-api-gateway
  template:
    metadata:
      labels:
        app: latch-api-gateway
    spec:
      serviceAccountName: latch-api-gateway
      containers:
        - name: latch-api-gateway
          image: python:3.12-slim
          command: ["/bin/sh", "-lc"]
          args:
            - |
              set -e
              pip install --no-cache-dir -r /app/requirements.txt
              exec uvicorn main:app --host 0.0.0.0 --port 8090 --app-dir /app
          env:
            - name: TARGET_NAMESPACE
              value: kubnamespace
            - name: METRICS_STATE_URL
              value: http://latch-metrics:8080/state
            - name: DETECTOR_INCIDENTS_URL
              value: http://latch-detector:8081/incidents
            - name: DIAGNOSER_BASE_URL
              value: http://latch-diagnoser:8082/incidents
            - name: VLLM_SELECTOR
              value: app.kubernetes.io/name=vllm
            - name: INFERENCE_LABEL_KEY
              value: llm-d.ai/inference-serving
            - name: REQUEST_TIMEOUT_S
              value: "10"
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: latch-api-gateway-code
---
apiVersion: v1
kind: Service
metadata:
  name: latch-api-gateway
spec:
  selector:
    app: latch-api-gateway
  ports:
    - name: http
      port: 8090
      targetPort: 8090
