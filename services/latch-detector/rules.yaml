# Deterministic imbalance detector rules.
# Kept external so future ML/AI policy can replace or augment this without changing service wiring.
rules:
  imbalance:
    enabled: true
    min_replicas: 2
    qps_skew_threshold: 3.0
    sustained_seconds: 20
    ttft_p95_increase_pct_threshold: -5.0
    baseline_window_seconds: 60
    min_qps_floor: 0.1
    zero_qps_epsilon: 0.001
